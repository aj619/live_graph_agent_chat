# Backend service fragment. Included from the root docker-compose.yml.
# Build context is the repository root (backend/Dockerfile COPY paths start at backend/).
# Runtime env comes from .env at container start via env_file. Nothing is baked into the image.
# Network `lgac` and volume `lgac_backend_data` are declared in the root file.
#
# Known gap: the host port is hard-coded to 8000 because no BACKEND_PORT variable exists
# in .env.example or .env.test.example. The backend runs only in the dev stack (plan §8.2
# test stack does not start it), so this does not collide with the test stack.
#
# Uploads: DATA_DIR=uploads is relative to WORKDIR /app, so the app writes to
# /app/uploads/uploads (main.py and routes_documents.py both join "uploads" onto DATA_DIR).
# The volume is mounted at /app/uploads, which covers that path.
#
# Logs: app/call_logging.py writes one file per chat request to logs/<chat_id>.log,
# relative to WORKDIR /app. Bind-mounted (not a named volume) so the owner can read
# them straight from the repository checkout at ../logs, which is gitignored.
#
# No depends_on: Neo4j and MySQL are not services in this compose project
# (compose/neo4j.yml and compose/mysql.yml are commented out of the root
# include: list — they run in their own separate compose project, on the
# external Docker network `shared_infra`, which this service also joins
# below). Readiness is checked by the app itself at startup, not by Compose:
# app.main's lifespan opens a real MySQL connection (registry.create_all) and
# a real Neo4j connection (GraphService.start -> build_indices_and_constraints)
# before the server accepts requests, and uvicorn exits with the connection
# error logged if either is unreachable. NEO4J_URI/MYSQL_HOST in .env must be
# set to the container names of the Neo4j/MySQL containers on shared_infra
# (Docker's embedded DNS resolves them there), not the old in-network names
# "neo4j"/"mysql" that only existed when compose/neo4j.yml and
# compose/mysql.yml were included in this project.

services:
  backend:
    build:
      # Relative to this file (compose/), so this is the repository root.
      context: ..
      dockerfile: backend/Dockerfile
    # No explicit container_name: Compose's <project>-<service>-<index> naming
    # keeps dev (lgac) and test (lgac-test) containers apart.
    restart: unless-stopped
    env_file:
      # Relative to this file (compose/), so this is the .env at the repository root.
      # This alone sets process env vars, but app.config deliberately re-reads a
      # literal file from disk (see its module docstring) — the bind mount below
      # and ENV_FILE_DIR give it that file at the path select_env_file() expects
      # inside the container, where backend/Dockerfile's COPY flattens the nesting
      # app.config's REPO_ROOT otherwise assumes.
      - ../.env
    environment:
      ENV_FILE_DIR: /app/env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - lgac_backend_data:/app/uploads
      - ../logs:/app/logs
      - ../.env:/app/env/.env:ro
      # Local BGE reranker's model weights (app/models.py), downloaded from the
      # HuggingFace Hub on first use under HF_HOME (backend/Dockerfile). Persists
      # the download across container recreates instead of re-fetching every time.
      - lgac_hf_cache:/app/.cache/huggingface
    networks:
      - lgac
      - shared_infra
