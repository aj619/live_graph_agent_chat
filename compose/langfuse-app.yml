# Langfuse's app services: langfuse-web (UI + API) and langfuse-worker
# (background ingestion). Included by the root docker-compose.yml. Both carry
# `profiles: [langfuse]` — optional, same as compose/langfuse-data.yml (plan
# D25). Start with:
#   docker compose --profile langfuse up -d
#
# Environment variable names are taken from the upstream Langfuse
# docker-compose.yml (langfuse/langfuse on GitHub); only the variables this
# self-hosted setup actually needs are listed, not every upstream default.
# DATABASE_URL and CLICKHOUSE_MIGRATION_URL are built from the same
# POSTGRES_*/CLICKHOUSE_* values the data services use, so there is one
# source of truth per credential.

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${NEXTAUTH_URL}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  SALT: ${SALT}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
  LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
  LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
  LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    profiles: ["langfuse"]
    restart: unless-stopped
    environment:
      <<: *langfuse-env
    ports:
      - "127.0.0.1:3030:3030"
    networks:
      - lgac
    depends_on:
      <<: *langfuse-depends-on

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    profiles: ["langfuse"]
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Browser-issued presigned media URLs must resolve from the host, not
      # the container network, so this one key differs from the shared block.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9000
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    networks:
      - lgac
    depends_on:
      <<: *langfuse-depends-on
