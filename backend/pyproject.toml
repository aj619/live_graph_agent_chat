[project]
name = "lgac-backend"
version = "0.1.0"
description = "Live Graph Agent Chat — backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",
    "graphiti-core[sentence-transformers]",
    # Declared directly (not just pulled in transitively via sentence-transformers)
    # so the tool.uv.sources pin below reliably targets it.
    "torch",
    "neo4j",
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "langfuse",
    "pypdf",
    "python-docx",
    "python-multipart",
    "sse-starlette",
    "sqlalchemy",
    "pymysql",
]

[tool.uv]
package = false

# This backend only ever runs in backend/Dockerfile's Debian container, or locally
# on Linux dev machines — never macOS/Windows. uv.lock is universal across platforms
# by default; narrowing it to the one platform this project actually targets is what
# lets the torch source pin below apply (PyTorch's CPU wheel index has no macOS
# build, so an unrestricted universal lock falls back off the pin entirely rather
# than apply it only where it can).
environments = [
    "sys_platform == 'linux'",
]

# sentence-transformers (pulled in by graphiti-core[sentence-transformers], for the
# local BGE reranker) depends on torch. Left to the default PyPI resolution, uv
# picks the CUDA build — nvidia-cudnn/nvidia-nccl/triton/cuda-bindings, ~1GB of
# GPU libraries this container has no GPU to use. Pin torch to PyTorch's own
# CPU-only wheel index instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live Neo4j/MySQL service, skipped without it",
    "live: requires a live external endpoint, never run in CI",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_untyped_defs = true
